plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache/**") // datagen cache files (patterns are relative to each resource dir)
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroupAndSubgroups('software.bernie.geckolib') }
    }
    // Iron's Arms 'n Artifice 1.21.1 depends on Sable's companion library
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sable'
                url = 'https://maven.ryanhcode.dev/releases'
            }
        }
        filter { includeGroup('dev.ryanhcode.sable-companion') }
    }
    maven {
        name = 'Redspace'
        url = 'https://code.redspace.io/releases'
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // the game test server has no --report option; Iron's Arms 'n Artifice installs a reporter that writes here
            systemProperty 'irons_artifice.gameTestReport', file('build/gametest-report.xml').getAbsolutePath()
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            // Optional (require = 0) mixin hooks still fail loudly here, so a missed one shows up in testing. This fails
            // other mods' optional hooks too: pass -PlooseMixins when testing alongside them
            if (!project.hasProperty('looseMixins')) {
                systemProperty 'mixin.debug.countInjections', 'true'
            }
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "io.redspace:irons_lib:${irons_lib_version}"
    implementation "io.redspace:irons_artifice:${irons_artifice_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            geckolib_version       : geckolib_version,
            irons_lib_version      : irons_lib_version,
            irons_artifice_version : irons_artifice_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '5000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// MIT asks for the notice in every copy, the jar included
tasks.named('jar') {
    from('LICENSE')
}

// Optional local additions, not part of the repo
if (file('local.gradle').exists()) {
    apply from: 'local.gradle'
}
